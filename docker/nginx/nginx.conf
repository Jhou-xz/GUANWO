# =============================================================================
# GuanWo (观我) — Main Nginx Configuration
# =============================================================================
# Production-grade Nginx config for a Chinese AI astrology web application.
# Acts as reverse proxy for Django/Gunicorn, serves static files, handles
# SSL termination, rate limiting, and SSE streaming for AI responses.
#
# Deployed via Docker Compose (nginx:1.26-alpine image).
# =============================================================================

# -----------------------------------------------------------------------------
# User & Process Model
# -----------------------------------------------------------------------------
# Run as nginx user (non-root, defined in alpine image).
# 'worker_processes auto' scales to available CPU cores.
user  nginx;
worker_processes  auto;

# PID file location inside container.
pid  /var/run/nginx.pid;

# -----------------------------------------------------------------------------
# Error Log
# -----------------------------------------------------------------------------
# Log at 'notice' level to stderr (captured by Docker daemon).
error_log  /var/log/nginx/error.log notice;

# -----------------------------------------------------------------------------
# Events Block — Connection Handling
# -----------------------------------------------------------------------------
events {
    # Use epoll (Linux) for efficient async I/O notification.
    use  epoll;

    # Max simultaneous connections per worker process.
    worker_connections  4096;

    # Allow a worker to accept all new connections at once.
    multi_accept  on;
}

# -----------------------------------------------------------------------------
# HTTP Block — Core HTTP Settings
# -----------------------------------------------------------------------------
http {
    # -------------------------------------------------------------------------
    # MIME Types
    # -------------------------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -------------------------------------------------------------------------
    # Character Encoding
    # -------------------------------------------------------------------------
    # UTF-8 is required for Chinese astrology content.
    charset  utf-8;

    # -------------------------------------------------------------------------
    # Log Format — JSON Structured Logs
    # -------------------------------------------------------------------------
    log_format  json_combined  escape=json
        '{ '
            '"timestamp":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"request_id":"$request_id",'
            '"method":"$request_method",'
            '"uri":"$uri",'
            '"query":"$query_string",'
            '"status":$status,'
            '"bytes_sent":$bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_time":"$upstream_response_time",'
            '"referer":"$http_referer",'
            '"user_agent":"$http_user_agent",'
            '"xff":"$http_x_forwarded_for",'
            '"rate_limit":"$limit_req_status"'
        ' }';

    access_log  /var/log/nginx/access.log  json_combined;

    # -------------------------------------------------------------------------
    # Request ID — Traceability
    # -------------------------------------------------------------------------
    map  $http_x_request_id  $request_id {
        default  $http_x_request_id;
        ""       $request_id;
    }

    # -------------------------------------------------------------------------
    # Real IP — Trust Docker Internal Network
    # -------------------------------------------------------------------------
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  127.0.0.1;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # -------------------------------------------------------------------------
    # Rate Limiting Zones
    # -------------------------------------------------------------------------
    limit_req_zone  $binary_remote_addr  zone=api_general:10m  rate=100r/m;
    limit_req_zone  $binary_remote_addr  zone=api_ai:10m  rate=20r/m;

    # -------------------------------------------------------------------------
    # Connection Limiting — Prevent Slowloris
    # -------------------------------------------------------------------------
    limit_conn_zone  $binary_remote_addr  zone=addr:10m;

    # -------------------------------------------------------------------------
    # Gzip Compression
    # -------------------------------------------------------------------------
    gzip                on;
    gzip_vary           on;
    gzip_proxied        any;
    gzip_comp_level     5;
    gzip_min_length     256;
    gzip_buffers        16 8k;
    gzip_http_version   1.1;

    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    # -------------------------------------------------------------------------
    # SSL Settings (Global Defaults)
    # -------------------------------------------------------------------------
    ssl_protocols  TLSv1.2 TLSv1.3;

    ssl_ciphers
        "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:
         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:
         ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:
         DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";

    ssl_prefer_server_ciphers  on;
    ssl_session_cache    shared:SSL:50m;
    ssl_session_timeout  1d;
    ssl_session_tickets  off;

    # -------------------------------------------------------------------------
    # Security Headers (Global — Applied Unless Overridden)
    # -------------------------------------------------------------------------
    add_header  Strict-Transport-Security  "max-age=31536000; includeSubDomains; preload"  always;
    add_header  X-Frame-Options  "SAMEORIGIN"  always;
    add_header  X-Content-Type-Options  "nosniff"  always;
    add_header  Content-Security-Policy  "default-src 'self';"  always;
    add_header  Referrer-Policy  "strict-origin-when-cross-origin"  always;
    add_header  Permissions-Policy  "camera=(), microphone=(), geolocation=()"  always;

    # -------------------------------------------------------------------------
    # Proxy Settings (Shared Defaults)
    # -------------------------------------------------------------------------
    proxy_connect_timeout   10s;
    proxy_send_timeout      10s;
    proxy_read_timeout      300s;

    proxy_buffering           on;
    proxy_buffer_size         4k;
    proxy_buffers             8 4k;
    proxy_busy_buffers_size   8k;

    proxy_http_version  1.1;

    # -------------------------------------------------------------------------
    # Client Body & Header Limits
    # -------------------------------------------------------------------------
    client_max_body_size  10m;
    large_client_header_buffers  4 8k;

    # -------------------------------------------------------------------------
    # File Transfer Optimization
    # -------------------------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    # -------------------------------------------------------------------------
    # Timeouts — Idle Connections
    # -------------------------------------------------------------------------
    keepalive_timeout      30;
    keepalive_requests     1000;

    types_hash_max_size  2048;

    # -------------------------------------------------------------------------
    # Include Server Blocks
    # -------------------------------------------------------------------------
    include  /etc/nginx/conf.d/*.conf;
}
