# =============================================================================
# SSL/TLS Configuration Snippet — Let's Encrypt Certificates
# =============================================================================
# This file contains SSL certificate paths and hardening settings.
# It is included by the HTTPS server block in guanwo.conf.
#
# Certificates are provisioned by Certbot (init-letsencrypt.sh) and mounted
# into the Nginx container via Docker volume:
#   ./nginx/ssl/:/etc/nginx/ssl/
#
# Let's Encrypt issues 90-day certificates; auto-renewal runs via cron.
# =============================================================================

# -----------------------------------------------------------------------------
# Certificate & Key Paths
# -----------------------------------------------------------------------------
ssl_certificate      /etc/nginx/ssl/fullchain.pem;
ssl_certificate_key  /etc/nginx/ssl/privkey.pem;
ssl_trusted_certificate  /etc/nginx/ssl/chain.pem;

# -----------------------------------------------------------------------------
# OCSP Stapling — Faster TLS Handshakes
# -----------------------------------------------------------------------------
ssl_stapling        on;
ssl_stapling_verify on;

resolver  223.5.5.5 8.8.8.8  valid=300s;
resolver_timeout  5s;

# -----------------------------------------------------------------------------
# Diffie-Hellman Parameters — Forward Secrecy
# -----------------------------------------------------------------------------
ssl_dhparam  /etc/nginx/ssl/dhparam.pem;
