# =============================================================================
# GuanWo (观我) — Primary Server Block Configuration
# =============================================================================
# Main application server block for your-domain.com and www.your-domain.com.
# Handles:
#   - HTTP → HTTPS redirect
#   - Static file serving (Vite SPA, Django collectstatic, media uploads)
#   - API reverse proxy to Django/Gunicorn with proper headers
#   - SSE streaming for AI responses (no buffering)
#   - Rate limiting on API endpoints
#   - SPA routing (all non-API routes → index.html)
#
# Backend service: 'django:8000' (Docker Compose service name).
# =============================================================================

# =============================================================================
# UPSTREAM DEFINITIONS
# =============================================================================

upstream django_backend {
    server  django:8000  max_fails=3  fail_timeout=30s;
    keepalive  32;
}

# =============================================================================
# HTTP (PORT 80) — Redirect to HTTPS
# =============================================================================
server {
    listen       80;
    listen  [::]:80;
    server_name  your-domain.com  www.your-domain.com;

    # ACME challenge location for Let's Encrypt certificate provisioning.
    location /.well-known/acme-challenge/ {
        root  /var/www/certbot;
    }

    # All other HTTP requests → 301 redirect to HTTPS.
    location / {
        return  301  https://$host$request_uri;
    }
}

# =============================================================================
# HTTPS (PORT 443) — Main Application Server
# =============================================================================
server {
    listen       443  ssl  http2;
    listen  [::]:443  ssl  http2;
    server_name  your-domain.com  www.your-domain.com;

    # Root directory for static file serving.
    root  /usr/share/nginx/html;
    index  index.html;

    # -------------------------------------------------------------------------
    # SSL Configuration
    # -------------------------------------------------------------------------
    include  /etc/nginx/conf.d/ssl.conf;

    # -------------------------------------------------------------------------
    # Request ID Header — Forward to Backend
    # -------------------------------------------------------------------------
    add_header  X-Request-ID  $request_id  always;
    proxy_set_header  X-Request-ID  $request_id;

    # -------------------------------------------------------------------------
    # Security Headers — Application-Specific Overrides
    # -------------------------------------------------------------------------
    add_header  Content-Security-Policy
        "default-src 'self'; "
        "script-src 'self'; "
        "style-src 'self' 'unsafe-inline'; "
        "img-src 'self' data: https:; "
        "font-src 'self'; "
        "connect-src 'self' https://api.your-domain.com; "
        "frame-ancestors 'self'; "
        "base-uri 'self'; "
        "form-action 'self';"
        always;

    # -------------------------------------------------------------------------
    # PROXY HEADERS — Common to All Proxy Locations
    # -------------------------------------------------------------------------
    proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header  X-Forwarded-Proto  $scheme;
    proxy_set_header  Host  $host;
    proxy_set_header  X-Real-IP  $remote_addr;
    proxy_set_header  Connection "";

    # =============================================================================
    # LOCATION BLOCKS — Request Routing
    # =============================================================================

    # -------------------------------------------------------------------------
    # 1. Let's Encrypt ACME Challenges (HTTPS variant, belt-and-suspenders)
    # -------------------------------------------------------------------------
    location /.well-known/acme-challenge/ {
        root  /var/www/certbot;
    }

    # -------------------------------------------------------------------------
    # 2. Health Check Endpoint — Bypass Rate Limiting
    # -------------------------------------------------------------------------
    location /api/health/ {
        proxy_pass  http://django_backend;
        proxy_connect_timeout  5s;
        proxy_read_timeout     10s;
    }

    # -------------------------------------------------------------------------
    # 3. AI API Endpoints — SSE Streaming + Rate Limiting
    #     /api/reading, /api/dream, /api/fortune, /api/analyze,
    #     /api/liuyao, /api/chat
    # -------------------------------------------------------------------------
    location ~ ^/api/(reading|dream|fortune|analyze|liuyao|chat)/?$ {
        limit_req  zone=api_ai  burst=10  nodelay;
        limit_conn  addr  10;

        # Disable buffering for streaming responses
        proxy_buffering          off;
        proxy_cache              off;
        proxy_set_header         X-Accel-Buffering  no;

        proxy_read_timeout       300s;
        proxy_send_timeout       300s;

        proxy_http_version       1.1;
        proxy_set_header         Connection  "";

        chunked_transfer_encoding  on;

        proxy_pass  http://django_backend;
    }

    # -------------------------------------------------------------------------
    # 4. General API Endpoints — Standard Rate Limiting
    # -------------------------------------------------------------------------
    location /api/ {
        limit_req  zone=api_general  burst=20  nodelay;
        limit_conn  addr  20;
        proxy_pass  http://django_backend;
    }

    # -------------------------------------------------------------------------
    # 6. Django Admin Panel
    # -------------------------------------------------------------------------
    location /admin/ {
        limit_req  zone=api_general  burst=5  nodelay;
        proxy_pass  http://django_backend;
    }

    # -------------------------------------------------------------------------
    # 7. Django Static Files (/static/) — Collectstatic Output
    # -------------------------------------------------------------------------
    location /static/ {
        alias  /usr/share/nginx/static/;
        expires  1y;
        add_header  Cache-Control  "public, immutable";

        location ~ /\. {
            deny  all;
            return  404;
        }
    }

    # -------------------------------------------------------------------------
    # 8. User Media Files (/media/) — User Uploads
    # -------------------------------------------------------------------------
    location /media/ {
        alias  /usr/share/nginx/media/;
        expires  1d;
        add_header  Cache-Control  "public, must-revalidate";

        location ~* \.(php|php3|php4|php5|phtml|pl|py|jsp|asp|aspx|cgi|sh|bash)$ {
            deny  all;
            return  403;
        }

        location ~ /\. {
            deny  all;
            return  404;
        }
    }

    # -------------------------------------------------------------------------
    # 9. Vite-Built Frontend Assets (/assets/) — Hashed Filenames
    # -------------------------------------------------------------------------
    location /assets/ {
        alias  /usr/share/nginx/html/assets/;
        expires  1y;
        add_header  Cache-Control  "public, immutable";
    }

    # -------------------------------------------------------------------------
    # 10. SPA Fallback — All Routes → index.html
    # -------------------------------------------------------------------------
    location / {
        try_files  $uri  $uri/  @spa_fallback;

        location = /index.html {
            add_header  Cache-Control  "no-cache, no-store, must-revalidate";
            expires  off;
        }

        location = /favicon.ico {
            expires  1w;
            access_log  off;
        }
        location = /robots.txt {
            expires  1w;
            access_log  off;
        }
    }

    location @spa_fallback {
        rewrite  ^  /index.html  break;
        add_header  Cache-Control  "no-cache, no-store, must-revalidate";
        add_header  Pragma  "no-cache";
        expires  off;
    }

    # -------------------------------------------------------------------------
    # 11. Error Pages
    # -------------------------------------------------------------------------
    error_page  500 502 503 504  /50x.html;
    location = /50x.html {
        root  /usr/share/nginx/html;
        add_header  Cache-Control  "no-cache, no-store, must-revalidate";
        internal;
    }

    error_page  429  @rate_limited;
    location @rate_limited {
        default_type  application/json;
        add_header  Retry-After  60  always;
        add_header  Content-Type  "application/json"  always;
        return  429  '{"error":"rate_limited","message":"请求过于频繁，请稍后再试。/ Too many requests, please try again later.","retry_after":60}';
    }
}

# =============================================================================
# CATCH-ALL SERVER BLOCK — Reject Unknown Hosts
# =============================================================================
server {
    listen       80   default_server;
    listen  [::]:80   default_server;
    listen       443  ssl  http2  default_server;
    listen  [::]:443  ssl  http2  default_server;

    ssl_certificate      /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key  /etc/nginx/ssl/privkey.pem;

    server_name  _;

    return  444;
}
