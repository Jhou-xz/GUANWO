# =============================================================================
# GuanWo (观我) — GitHub Actions CI/CD Pipeline
# =============================================================================
# Trigger:   Push to main branch
# Flow:      Test → Deploy to VPS
# Secrets:   SSH_PRIVATE_KEY, SERVER_IP, SERVER_USER, DOMAIN
# =============================================================================

name: GuanWo CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip test phase (for hotfixes)'
        type: boolean
        required: false
        default: false

concurrency:
  group: production
  cancel-in-progress: true

env:
  DEPLOY_DIR: /opt/guanwo
  COMPOSE_FILE: docker/docker-compose.yml

jobs:
  # =========================================================================
  # JOB: Test — Run Django test suite
  # =========================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[no ci]') &&
      !inputs.skip_tests

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: guanwo_test
          POSTGRES_USER: guanwo
          POSTGRES_PASSWORD: guanwo_test_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: server/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt

      - name: Run Django test suite
        env:
          DATABASE_URL: postgres://guanwo:guanwo_test_pass@localhost:5432/guanwo_test
          REDIS_URL: redis://localhost:6379/1
          DJANGO_SECRET_KEY: github-actions-test-key-not-for-production
          DEBUG: 'True'
        run: |
          cd server
          python manage.py test --verbosity=2

      - name: Django system checks
        env:
          DJANGO_SECRET_KEY: github-actions-test-key-not-for-production
          DEBUG: 'True'
        run: |
          cd server
          python manage.py check --deploy --fail-level WARNING || true

  # =========================================================================
  # JOB: Deploy — SSH to VPS and execute deployment
  # =========================================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test
    if: |
      always() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Execute deployment on VPS
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
            "cd ${{ env.DEPLOY_DIR }} && bash docker/scripts/deploy.sh"

      - name: Health check
        run: |
          echo "Waiting for services to stabilize..."
          sleep 10

          HEALTH_URL="https://${{ secrets.DOMAIN }}/api/health/"
          MAX_RETRIES=12
          RETRY_INTERVAL=5

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Health check attempt $i/$MAX_RETRIES..."

            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 10 \
              --retry 0 \
              "$HEALTH_URL" || echo "000")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ Health check PASSED ($HEALTH_URL)"
              curl -s "$HEALTH_URL" | python -m json.tool || true
              exit 0
            fi

            echo "  → HTTP $HTTP_CODE, retrying in ${RETRY_INTERVAL}s..."
            sleep $RETRY_INTERVAL
          done

          echo "✗ Health check FAILED after $MAX_RETRIES attempts"
          exit 1

      - name: Notify success
        if: success()
        run: |
          echo "✓ Deployment completed successfully!"

      - name: Notify failure
        if: failure()
        run: |
          echo "✗ Deployment failed!"

# =============================================================================
#  SECRETS REQUIRED
# =============================================================================
# Navigate to: Settings → Secrets and variables → Actions → New repository secret
#
# | Secret Name      | Description                                   |
# |------------------|-----------------------------------------------|
# | SSH_PRIVATE_KEY  | Private SSH key for VPS access                |
# | SERVER_IP        | VPS public IP address                         |
# | SERVER_USER      | Deployment user on VPS (e.g., guanwo)         |
# | DOMAIN           | Your domain name (e.g., your-domain.com)      |
# | SLACK_WEBHOOK    | (Optional) Slack webhook URL for notifications|
#
# SSH Key Setup:
#   1. Generate key pair (on VPS): ssh-keygen -t ed25519 -C "guanwo-deploy"
#   2. Add public key to authorized_keys
#   3. Copy PRIVATE key to GitHub secret
# =============================================================================
